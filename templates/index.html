<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta</title>
</head>
<body>
  <h1>Consultar dato</h1>
  <input type="number" id="numero" placeholder="Ingresá un número">
  <button onclick="buscar()">Consultar</button>
  <div id="resultado"></div>
</body>
</html>

<script>
  async function buscar() {
    const numero = document.getElementById("numero").value;
    const res = await fetch(`/api/consultar?numero=${numero}`);
    const data = await res.json();

    const div = document.getElementById("resultado");
    if (data.valor) {
      div.textContent = `Resultado: ${data.valor}`;
    } else {
      div.textContent = data.error;
    }
  }
</script>
